publications:
  - title: "Predictive Translation: High-Performance Buffer Management Without the Trade-Offs"
    authors: "Michael Zinsmeister, Lam-Duy Nguyen, Viktor Leis, Thomas Neumann"
    venue: "SIGMOD 2026 (Proceedings of the ACM on Management of Data)"
    location: "Bengaluru, India"
    doi: "https://doi.org/10.1145/3786678"
    pdf: "https://db.in.tum.de/~zinsmeister/papers/predictive-translation.pdf"
    code: "https://github.com/mzinsmeister/PrediCache"
    summary: "Traditional database buffer managers rely on simple hash tables—robust and portable but slow. Newer designs are fast but complex and less portable. Predictive Translation delivers state-of-the-art performance using deterministic page placement and CPU latency hiding, while remaining portable and easy to integrate."
    featured: true
  - title: "Maintaining a Sample Under Concurrent Updates"
    authors: "Michael Zinsmeister"
    venue: "Master's Thesis, Technical University of Munich (TUM)"
    year: "2024"
    pdf: "papers/masters-thesis.pdf"
    summary: "Master's thesis focusing on the design and implementation of database sampling algorithms that maintain accurate samples under highly concurrent update streams."
  - title: "Introduction of an object storage solution into an existing software system"
    authors: "Michael Zinsmeister"
    venue: "Bachelor's Thesis, Hochschule München"
    location: "Munich, Germany"
    year: "2022"
    summary: "Designed and integrated an S3-compatible Object Storage solution into an existing pharmacy billing system during my dual studies."
