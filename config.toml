# Short Bio
bio = "I am a PhD student at the Technical University of Munich (TUM) Chair for Data Science and Engineering, advised by Prof. Thomas Neumann. My research focuses on high-performance buffer management for database systems that must handle datasets larger than main memory while leveraging modern flash and NVMe storage. Previously, I worked as a dual student and working student (Werkstudent) at NOVENTI Health SE, gaining hands-on experience with production systems, Docker, and large-scale migrations."

# Research Intro
research_intro = "My research is centered around systems-level database performance, specifically in making high-performance buffer management techniques practical and portable. I am an active contributor to the Umbra database project at TUM, building systems optimized for modern hardware."

